id = "examples.video"
name = "Video"
version = "0.1.0"
min_kobe_version = "0.8.24"
description = "Play any video as ANSI/ASCII characters in a tab — ffmpeg decode, character render, no real video anywhere"
platforms = ["macos", "linux"]

# Built on @sma1lboy/kobe-plugin-sdk (TypeScript) — compiled at install time.
[[build]]
command = ["npm", "install", "--no-audit", "--no-fund"]

[[build]]
command = ["npm", "run", "build"]

[[panes]]
id = "play"
title = "Video"
placement = "tab"
command = ["node", "$KOBE_PLUGIN_ROOT/dist/player.js"]

[[actions]]
id = "open"
title = "Play a video file/URL as characters"
command = ["node", "dist/open.js"]

[[settings]]
key = "KOBE_VIDEO_MODE"
label = "Render style"
type = "enum"
options = ["half", "ascii"]
default = "half"

[[settings]]
key = "KOBE_VIDEO_FPS"
label = "Frames per second"
type = "number"
default = "15"

[[settings]]
key = "KOBE_VIDEO_LOOP"
label = "Loop playback"
type = "boolean"

[[file_handlers]]
pattern = "\\.(mp4|mov|m4v|webm|mkv|avi)$"
action = "open"
