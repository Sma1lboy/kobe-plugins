id = "kobe.notify"
name = "Notify"
version = "0.2.0"
min_kobe_version = "0.8.29"
description = "Desktop (and optional ntfy push) notifications when an agent finishes, errors, or needs you"
platforms = ["macos", "linux"]

[[build]]
command = ["npm", "install", "--no-audit", "--no-fund"]

[[build]]
command = ["npm", "run", "build"]

[[settings]]
key = "NTFY_URL"
label = "ntfy push URL"
type = "string"

[[events]]
on = "agent.turn-complete"
command = ["node", "dist/notify.js"]

[[events]]
on = "agent.permission-needed"
command = ["node", "dist/notify.js"]

[[events]]
on = "agent.rate-limited"
command = ["node", "dist/notify.js"]

[[events]]
on = "agent.error"
command = ["node", "dist/notify.js"]

[[actions]]
id = "test"
title = "Send a test notification"
command = ["node", "dist/notify.js", "test"]
