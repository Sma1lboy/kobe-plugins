id = "examples.browser"
name = "Browser"
version = "0.1.0"
min_kobe_version = "0.8.24"
description = "A real Chromium browser rendered as terminal cells (carbonyl) in a pane tab"
platforms = ["macos", "linux"]

# Self-provisioning: `kobe plugin install` runs this in the checkout, so
# carbonyl (and its platform Chromium binary) lands inside the plugin's own
# directory — nothing global, nothing downloaded at pane-open time.
[[build]]
command = ["npm", "install", "--no-audit", "--no-fund"]

# Built on @sma1lboy/kobe-plugin-sdk (TypeScript) — compiled at install time.
[[build]]
command = ["npm", "run", "build"]

[[panes]]
id = "browse"
title = "Browser"
command = ["node", "$KOBE_PLUGIN_ROOT/dist/browse.js"]

[[actions]]
id = "open"
title = "Open a URL in the browser pane"
command = ["node", "dist/open.js"]

[[settings]]
key = "BROWSER_HOME"
label = "Home page URL"
type = "string"
default = "https://example.com"
